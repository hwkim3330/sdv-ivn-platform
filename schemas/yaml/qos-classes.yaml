# SDV-IVN 통신 QoS 프로파일 — spec/SDV-IVN-Part3-QoS-Profile.md 의 기계 판본
#
# 애플리케이션이 고르는 것은 이 다섯 개가 전부다. reliability 도, deadline 도,
# PCP 도 애플리케이션이 정하지 않는다. 그것이 이 파일이 존재하는 이유다:
# 개발자에게 DDS 옵션을 그대로 노출하면 같은 요구사항이 팀마다 다른 QoS 로
# 구현되고, 네트워크는 그 차이를 조정할 방법이 없다.
#
# 이 파일에서 파생되는 것:
#   DDS QoS        (dds/fastdds, dds/cyclonedds)
#   VLAN / PCP     (network/vlan)
#   CBS / TAS      (network/tsn)
#   802.1CB FRER   (network/frer)
#   승인 판정      (middleware/qos/mapper.py, middleware/core/deploy.py)
#
# 숫자의 출처
#   [KPI]     과제가 직접 겨누는 측정 목표 (Edge->HPC 5 ms, 지터 2.5 ms)
#   [802.1DG] IEEE 802.1DG 차량용 TSN 프로파일 관행에 맞춘 값
#   [KETI]    이 프로파일의 설계 선택. TTA 초안 전에 바뀔 수 있다.
#
# DEADLINE 과 지연 예산은 다른 것이다 (자주 섞인다)
#   latency_budget_ms  토커가 보낸 뒤 리스너에 닿기까지. 과제 KPI 가 겨누는 값.
#   deadline           샘플과 샘플 사이의 최대 간격. 발행이 멎은 것을 잡는 장치.
#
# 둘을 한 값으로 묶으면 정상 동작하는 스트림이 계속 위반으로 보고된다. 주기
# 10 ms 스트림에 마감 5 ms 를 걸면 매 샘플이 위반이다 — 실제로 모니터를 붙이고
# 나서 이 오류를 잡았다. 그래서 마감은 오로지 주기에서 파생한다:
#
#   deadline = 주기 x deadline_tolerance
#
# 등급 상한을 두려다 두 번째로 틀렸다. 1 Hz 로 도는 결함 보고에 1.5 s 마감은
# 옳은 값인데 상한이 그것을 거부했다. 느린 안전 스트림이 문제가 아니라,
# 래치(transient_local) 토픽처럼 애초에 주기가 없는 것에 주기를 지어낸 것이
# 문제였다. 그런 스트림은 event_driven 으로 표시하고 마감을 끈다.

version: "0.1.0"
profile: sdv-ivn
spec: "SDV-IVN Part 3"

policy:
  # PCP 7 을 애플리케이션 등급에 줄 것인가.
  #
  # 이 프로파일은 REDUNDANT_SAFETY 에 7 을 준다(설계 지시). 대가는 명확하다:
  # gPTP(802.1AS) 와 TSN 재구성 트래픽이 최상위 우선순위를 애플리케이션과
  # 나눠 쓰게 된다. 시간 동기가 밀리면 TAS 게이트 자체가 밀리므로, 이것은
  # 이론적 위험이 아니라 측정해야 할 항목이다.
  #
  # false 로 두면 REDUNDANT_SAFETY 가 PCP 6, SAFETY_CRITICAL 이 5 로 내려가고
  # 7 은 network_ctrl 전용이 된다. 시험 항목: 두 설정에서 gPTP 오프셋 분포를
  # 비교한다 (tests/performance/ptp_offset_under_load).
  allow_pcp7_for_applications: true
  admission_ceiling: 0.75      # [KETI] 포트 대역의 75% 이상은 승인하지 않는다

domains:
  # 가상 도메인 하나 = VLAN 하나. 분리는 우선순위보다 도메인이 먼저다:
  # 침해된 인포테인먼트 노드가 섀시 VLAN 으로 프레임을 낼 수 없어야 한다.
  chassis:      { vlan: 10, description: "제동/조향/구동 — 안전 관련 실시간 제어" }
  adas:         { vlan: 20, description: "인지/측위/계획 — 고대역 센서와 실시간" }
  body:         { vlan: 30, description: "도어/공조/조명 — 존 버스의 상태와 명령" }
  infotainment: { vlan: 40, description: "미디어/HMI — 격리된 비안전 도메인" }
  diagnostics:  { vlan: 50, description: "진단/로그/OTA — 최저 우선순위" }
  network_ctrl: { vlan:  1, description: "gPTP, TSN 재구성, 반도체 관리" }

classes:

  BEST_EFFORT:
    id: SDV_QOS_0
    description: "남는 대역만 쓴다. 로그, 통계, HMI 상태."
    latency_budget_ms: null
    deadline_tolerance: 10.0     # 주기의 몇 배까지 벌어져도 괜찮은가
    jitter_budget_ms: null
    pcp: 0
    traffic_class: 0
    shaper: best_effort
    redundancy: none
    reliability: best_effort
    durability: volatile
    history: { kind: keep_last, depth: 1 }
    dscp: 0
    preemption: preemptable
    max_rate_mbps: null
    default_domain: diagnostics

  BULK_DATA:
    id: SDV_QOS_1
    description: >
      크고, 실시간이 아니고, 반드시 도착해야 하는 것. 지도, OTA 이미지,
      캘리브레이션. 이 등급이 따로 있는 이유는 실측된 것이다: 8 MB 급
      lanelet2 지도가 기본 UDP 소켓 버퍼에서 조각 유실이 나 planner 가
      지도를 못 받았다 (autoware-keti/config/fastdds_udp.xml).
    latency_budget_ms: null
    deadline_tolerance: 5.0
    jitter_budget_ms: null
    pcp: 2
    traffic_class: 2
    shaper: cbs
    redundancy: none
    reliability: reliable
    durability: transient_local   # 늦게 붙는 구독자가 지도를 받는 유일한 길
    history: { kind: keep_last, depth: 1 }
    dscp: 10                      # AF11
    preemption: preemptable
    max_rate_mbps: 500
    default_domain: diagnostics

  REALTIME:
    id: SDV_QOS_2
    description: >
      주기적이고 마감이 있으나 한 샘플을 버려도 되는 것. 라이다, 카메라,
      IMU/GNSS, 궤적, 차량 상태. 다음 샘플이 곧 오므로 재전송이 오히려 해롭다.
    latency_budget_ms: 10.0
    deadline_tolerance: 2.0
    jitter_budget_ms: 5.0
    pcp: 4
    traffic_class: 4
    shaper: cbs                   # 802.1Qav — 버스트를 펴는 쪽이 맞다
    redundancy: none
    reliability: best_effort
    durability: volatile
    history: { kind: keep_last, depth: 2 }
    dscp: 34                      # AF41
    preemption: preemptable
    max_rate_mbps: 2500
    default_domain: adas

  SAFETY_CRITICAL:
    id: SDV_QOS_3
    description: >
      제어 명령, 측위 자세, 결함 보고. 놓치면 안전이 깨지지만 경로 이중화까지는
      요구하지 않는 것. 과제 KPI 가 직접 겨누는 등급.
    latency_budget_ms: 5.0        # [KPI] Edge -> HPC 최대 지연 5 ms
    jitter_budget_ms: 2.5         # [KPI] 최대 지터 2.5 ms
    deadline_tolerance: 1.5       # DDS DEADLINE = 주기 x 1.5. 지연 예산과 다른 것이다.
    pcp: 6                        # [802.1DG]
    traffic_class: 6
    shaper: tas                   # 802.1Qbv 보호 윈도우
    redundancy: none
    reliability: reliable
    durability: volatile
    history: { kind: keep_last, depth: 1 }
    liveliness: automatic
    dscp: 46                      # EF
    preemption: express           # 802.1Qbu/802.3br express MAC
    max_rate_mbps: 50
    default_domain: chassis

  REDUNDANT_SAFETY:
    id: SDV_QOS_4
    description: >
      SAFETY_CRITICAL 에 경로 이중화를 더한 것. 한 링크나 한 스위치가 죽어도
      끊기지 않아야 하는 스트림. 802.1CB 로 두 경로에 복제하고 수신측에서 제거한다.
      복제분이 네트워크 대역을 두 배로 먹는다는 점은 승인 계산에 반영된다.
    latency_budget_ms: 5.0
    jitter_budget_ms: 2.5
    deadline_tolerance: 1.5
    pcp: 7                        # policy.allow_pcp7_for_applications 참조
    traffic_class: 7
    shaper: tas
    redundancy: frer_dual
    paths: 2
    reliability: reliable
    durability: volatile
    history: { kind: keep_last, depth: 1 }
    liveliness: automatic
    dscp: 46
    preemption: express
    max_rate_mbps: 50
    default_domain: chassis

# policy.allow_pcp7_for_applications 가 false 일 때 적용되는 대체 배치.
pcp_fallback:
  REDUNDANT_SAFETY: { pcp: 6, traffic_class: 6 }
  SAFETY_CRITICAL:  { pcp: 5, traffic_class: 5 }

links:
  # 승인 검사가 재는 대상. 과제의 두 반도체에 대응한다.
  multigige_10g: { rate_mbps: 10000, medium: "Multi-GigE",            preemption: true,  tas: true,  cbs: true,  frer: true }
  multigige_2g5: { rate_mbps: 2500,  medium: "2.5GBASE-T1",           preemption: true,  tas: true,  cbs: true,  frer: true }
  multigige_1g:  { rate_mbps: 1000,  medium: "1000BASE-T1",           preemption: true,  tas: true,  cbs: true,  frer: true }
  t1s_10m:       { rate_mbps: 10,    medium: "10BASE-T1S multidrop",  preemption: false, tas: false, cbs: false, frer: false, plca: true }

# 10BASE-T1S 세그먼트에 실릴 수 있는 등급. 10 Mb/s 에 포인트클라우드를 얹는
# 설계를 막기 위해 프로파일 차원에서 못박는다. 매퍼가 이 목록을 강제한다.
link_admissible_classes:
  t1s_10m: [BEST_EFFORT, SAFETY_CRITICAL, REDUNDANT_SAFETY]
